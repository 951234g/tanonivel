    .tile .nm{font-size:.85rem;line-height:1.1;font-weight:800;text-align:center;pointer-events:none;word-break:break-word}

<body>
<div id="app"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/*LOGIC_START*/
const TIERS=['S','A','B','C','D','E','F'];
const POINTS_PER_HIT=10;     // pontos por item no nível exato
const PERFECT_MULT=2;        // gabaritou? dobra os pontos da rodada
const MIN_ITEMS=4, MAX_ITEMS=8, MAX_LEN=20;  // itens que o dono escreve
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function cleanName(n){return String(n||'').replace(/\s+/g,' ').trim().slice(0,16);}
function mkGame(hostPid,hostName){
  return {hostPid,code:'',phase:'lobby',players:[{pid:hostPid,name:cleanName(hostName),connected:true}],
    order:[],round:0,themeOrder:[],scores:{},rounds:[],cur:null};
}
function nameOf(G,pid){const p=G.players.find(x=>x.pid===pid);return p?p.name:'?';}
function connectedPlayers(G){return G.players.filter(p=>p.connected);}
function addPlayer(G,pid,name){
  const ex=G.players.find(p=>p.pid===pid);
  if(ex){ex.connected=true;return {ok:true};}
  if(G.phase!=='lobby')return {error:'A partida já começou.'};
  if(G.players.length>=10)return {error:'A sala já tem 10 jogadores.'};
  name=cleanName(name);
  if(!name)return {error:'Digite seu nome.'};
  if(G.players.some(p=>p.name.toLowerCase()===name.toLowerCase()))return {error:'Já existe alguém com esse nome na sala.'};
  G.players.push({pid,name,connected:true});
  return {ok:true};
}
function cleanItems(arr){
  if(!Array.isArray(arr))return null;
  const out=arr.map(x=>String(x||'').replace(/\s+/g,' ').trim().slice(0,MAX_LEN)).filter(x=>x.length>0);
  if(out.length<MIN_ITEMS||out.length>MAX_ITEMS)return null;
  const low=out.map(x=>x.toLowerCase());
  if(new Set(low).size!==out.length)return null;
  return out;
}
function validPlacement(n,pl){
  if(!pl||typeof pl!=='object')return null;
  const out={};
  for(let i=0;i<n;i++){const t=pl[i];if(!TIERS.includes(t))return null;out[i]=t;}
  return out;
}
function beginRound(G){
  G.cur={themeId:G.themeOrder[G.round],ownerPid:G.order[G.round],items:[],truth:null,guesses:{},points:{},hits:{},perfect:{},skipped:false};
  G.phase='owner';
}
function startGame(G,themes){
  const ps=connectedPlayers(G);
  if(ps.length<3)return {error:'São necessários pelo menos 3 jogadores conectados.'};
  G.order=shuffle(ps.map(p=>p.pid));
  let to=[];while(to.length<G.order.length)to=to.concat(shuffle(themes.map((_,i)=>i)));
  G.themeOrder=to.slice(0,G.order.length);
  G.scores={};G.order.forEach(p=>G.scores[p]=0);
  G.rounds=[];G.round=0;G.cur=null;G.howto={};G.phase='howto';
  return {ok:true};
}
function howtoReady(G,pid){
  if(G.phase!=='howto')return {error:'Fase errada.'};
  if(!G.order.includes(pid))return {error:'Você não está na partida.'};
  G.howto[pid]=true;
  const need=G.order.filter(p=>{const x=G.players.find(q=>q.pid===p);return x&&x.connected;});
  if(need.length>0&&need.every(p=>G.howto[p]))beginRound(G);
  return {ok:true};
}
function guessers(G){return G.order.filter(p=>p!==G.cur.ownerPid);}
function advance(G){
  if(G.round+1>=G.order.length){G.phase='final';}
  else{G.round++;beginRound(G);}
}
function submitTruth(G,themes,pid,items,pl){
  if(G.phase!=='owner')return {error:'Não é hora de montar o ranking.'};
  if(pid!==G.cur.ownerPid)return {error:'Esta rodada não é sua.'};
  const it=cleanItems(items);
  if(!it)return {error:'Escreva de '+MIN_ITEMS+' a '+MAX_ITEMS+' itens diferentes.'};
  const v=validPlacement(it.length,pl);
  if(!v)return {error:'Coloque todos os itens em algum nível.'};
  G.cur.items=it;G.cur.truth=v;G.phase='guess';
  return {ok:true};
}
function scoreRound(G,themes){
  const cur=G.cur,n=cur.items.length;
  guessers(G).forEach(pid=>{
    const g=cur.guesses[pid];
    if(!g){cur.hits[pid]=0;cur.points[pid]=0;cur.perfect[pid]=false;return;}
    let hits=0;for(let i=0;i<n;i++)if(g[i]===cur.truth[i])hits++;
    const perfect=hits===n;
    let pts=hits*POINTS_PER_HIT;if(perfect)pts*=PERFECT_MULT;
    cur.hits[pid]=hits;cur.points[pid]=pts;cur.perfect[pid]=perfect;
    G.scores[pid]=(G.scores[pid]||0)+pts;
  });
  G.rounds.push(cur);
  G.phase='reveal';
}
function submitGuess(G,themes,pid,pl){
  if(G.phase!=='guess')return {error:'Não é hora de palpitar.'};
  if(!G.order.includes(pid)||pid===G.cur.ownerPid)return {error:'Você não palpita nesta rodada.'};
  if(G.cur.guesses[pid])return {error:'Você já enviou.'};
  const v=validPlacement(G.cur.items.length,pl);
  if(!v)return {error:'Coloque todos os itens em algum nível.'};
  G.cur.guesses[pid]=v;
  if(guessers(G).every(p=>G.cur.guesses[p]))scoreRound(G,themes);
  return {ok:true};
}
function forceReveal(G,themes){
  if(G.phase!=='guess')return {error:'Fase errada.'};
  if(!Object.keys(G.cur.guesses).length)return {error:'Ninguém enviou palpite ainda. Use “Pular rodada”.'};
  scoreRound(G,themes);return {ok:true};
}
function skipRound(G){
  if(G.phase!=='owner'&&G.phase!=='guess')return {error:'Fase errada.'};
  G.cur.skipped=true;G.rounds.push(G.cur);advance(G);return {ok:true};
}
function act(G,pid,m,themes){
  const host=pid===G.hostPid;
  switch(m.a){
    case 'truth':return submitTruth(G,themes,pid,m.items,m.pl);
    case 'guess':return submitGuess(G,themes,pid,m.pl);
    case 'start':if(!host||G.phase!=='lobby')return {error:'Só o anfitrião, no lobby.'};return startGame(G,themes);
    case 'howto':return howtoReady(G,pid);
    case 'howtogo':if(!host||G.phase!=='howto')return {error:'Só o anfitrião.'};beginRound(G);return {ok:true};
    case 'force':if(!host)return {error:'Só o anfitrião.'};return forceReveal(G,themes);
    case 'skip':if(!host)return {error:'Só o anfitrião.'};return skipRound(G);
    case 'next':if(!host||G.phase!=='reveal')return {error:'Só o anfitrião, após o resultado.'};advance(G);return {ok:true};
    case 'again':
      if(!host||G.phase!=='final')return {error:'Só o anfitrião, no fim.'};
      G.phase='lobby';G.round=0;G.order=[];G.rounds=[];G.scores={};G.cur=null;return {ok:true};
  }
  return {error:'Ação desconhecida.'};
}
function viewFor(G,pid,themes){
  const v={phase:G.phase,code:G.code,isHost:pid===G.hostPid,me:nameOf(G,pid),
    players:G.players.map(p=>({name:p.name,connected:p.connected,host:p.pid===G.hostPid})),
    connectedCount:connectedPlayers(G).length,round:G.round+1,totalRounds:G.order.length};
  if(G.phase==='howto'){
    v.iReady=!!G.howto[pid];
    v.readyCount=G.order.filter(p=>G.howto[p]).length;v.total=G.order.length;
    v.waiting=G.order.filter(p=>!G.howto[p]&&(G.players.find(q=>q.pid===p)||{}).connected).map(p=>nameOf(G,p));
  }
  if(G.phase==='owner'||G.phase==='guess'||G.phase==='reveal'){
    const cur=G.cur,th=themes[cur.themeId];
    v.theme=th.name;v.items=G.phase==='owner'?[]:cur.items;v.limits={min:MIN_ITEMS,max:MAX_ITEMS,len:MAX_LEN};v.ownerName=nameOf(G,cur.ownerPid);v.isOwner=pid===cur.ownerPid;
    if(G.phase==='guess'){
      const gs=guessers(G);
      v.submitted=!!cur.guesses[pid];
      v.done=gs.filter(p=>cur.guesses[p]).length;v.total=gs.length;
      v.waiting=gs.filter(p=>!cur.guesses[p]).map(p=>nameOf(G,p));
    }
    if(G.phase==='reveal'){
      v.truth=cur.truth;v.lastRound=G.round+1>=G.order.length;
      v.results=guessers(G).map(p=>({name:nameOf(G,p),submitted:!!cur.guesses[p],hits:cur.hits[p]||0,
        points:cur.points[p]||0,perfect:!!cur.perfect[p],guess:cur.guesses[p]||null}))
        .sort((a,b)=>b.points-a.points);
    }
  }
  if(G.phase==='final'){
    v.leaderboard=G.order.map(p=>({name:nameOf(G,p),total:G.scores[p]||0,
      perfects:G.rounds.filter(r=>r.perfect&&r.perfect[p]).length})).sort((a,b)=>b.total-a.total);
    v.history=G.rounds.map(r=>({theme:themes[r.themeId].name,owner:nameOf(G,r.ownerPid),skipped:r.skipped,
      pts:G.order.filter(p=>p!==r.ownerPid).map(p=>({name:nameOf(G,p),p:r.points[p]||0,perfect:!!r.perfect[p]}))}));
  }
  return v;
}
/*LOGIC_END*/

const THEMES=[{name:"Frutas"},{name:"Comidas de festa"},{name:"Doces e sobremesas"},{name:"Bichos de estimação"},{name:"Esportes"},{name:"Bebidas"},{name:"Lanches"},{name:"Lugares para viajar"},{name:"Filmes ou séries"},{name:"Músicas ou cantores"},{name:"Meios de transporte"},{name:"Brincadeiras de infância"},{name:"Legumes e verduras"},{name:"Brinquedos e jogos"},{name:"Tarefas de casa"},{name:"Sabores de sorvete"},{name:"Matérias da escola"},{name:"Desenhos animados"},{name:"Comidas do dia a dia"}];

const TCOLOR={S:'#ff7f7f',A:'#ffbf7f',B:'#ffff7f',C:'#7fff7f',D:'#7fffff',E:'#7f7fff',F:'#ff7fff'};

const $app=document.getElementById('app');
let V=null;
let ui={screen:'home',status:''};
let local={sel:null,place:{},placeKey:'',homeName:null,homeCode:null};
let net={role:null,peer:null,conn:null,G:null,conns:{},pid:null,name:'',code:'',got:false,connAt:0,leaving:false};
let lastKey='';

function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  for(const k in(attrs||{})){
    const v=attrs[k];
    if(k==='class')el.className=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else if(v===true)el.setAttribute(k,'');
    else if(v!==false&&v!=null)el.setAttribute(k,v);
  }
  kids.flat(Infinity).forEach(c=>{if(c==null||c===false)return;el.appendChild(typeof c==='object'?c:document.createTextNode(String(c)));});
  return el;
}
function toast(msg){const t=h('div',{class:'toast'},msg);document.body.appendChild(t);setTimeout(()=>t.remove(),3200);}
function rid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
function newCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
const ss={get:k=>{try{return sessionStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{sessionStorage.setItem(k,v);}catch(e){}},del:k=>{try{sessionStorage.removeItem(k);}catch(e){}}};
const ls={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}},del:k=>{try{localStorage.removeItem(k);}catch(e){}}};
async function keepAwake(){try{if(navigator.wakeLock)await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ui.screen==='game')keepAwake();});

/* ---------- ações ---------- */
function send(m){
  if(net.role==='host')hostAct(net.pid,m);
  else if(net.conn&&net.conn.open)net.conn.send(Object.assign({t:'act'},m));
  else toast('Sem conexão com a sala. Aguarde…');
}

/* ---------- anfitrião ---------- */
function hostSend(){
  const G=net.G;
  G.players.forEach(p=>{
    if(p.pid===net.pid)return;
    const c=net.conns[p.pid];
    if(c&&c.open){try{c.send({t:'state',v:viewFor(G,p.pid,THEMES)});}catch(e){}}
  });
  V=viewFor(G,net.pid,THEMES);ui.screen='game';ui.status='';
  ls.set('tn_host',JSON.stringify({G,code:G.code}));
  paint();
}
function hostAct(pid,m){
  const res=act(net.G,pid,m,THEMES);
  if(res.error){
    if(pid===net.pid)toast(res.error);
    else{const c=net.conns[pid];if(c&&c.open)c.send({t:'error',m:res.error});}
    return;
  }
  hostSend();
}
function onConn(conn){
  conn.on('data',m=>{
    const G=net.G;if(!m||!G)return;
    if(m.t==='join'){
      const pid=String(m.pid||'').slice(0,40);
      if(!pid||pid===G.hostPid){conn.close();return;}
      const res=addPlayer(G,pid,m.name);
      if(res.error){conn.send({t:'error',m:res.error,fatal:true});setTimeout(()=>{try{conn.close();}catch(e){}},600);return;}
      conn.pid=pid;
      const old=net.conns[pid];net.conns[pid]=conn;
      if(old&&old!==conn){try{old.close();}catch(e){}}
      hostSend();
    }else if(m.t==='act'&&conn.pid){
      hostAct(conn.pid,m);
    }
  });
  conn.on('close',()=>{
    const pid=conn.pid;
    if(pid&&net.conns[pid]===conn){
      delete net.conns[pid];
      const p=net.G.players.find(x=>x.pid===pid);
      if(p)p.connected=false;
      hostSend();
    }
  });
}
function openHostPeer(code,resume,tries){
  if(net.peer){try{net.peer.destroy();}catch(e){}}
  const peer=new Peer('tanonivel-'+code);
  net.peer=peer;
  peer.on('open',()=>{net.G.code=code;net.code=code;ss.set('tn_role','host');keepAwake();hostSend();});
  peer.on('connection',onConn);
  peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){
      if(resume&&tries<15){ui.status='Retomando a sala…';paint();setTimeout(()=>openHostPeer(code,true,tries+1),3000);}
      else if(!resume)openHostPeer(newCode(),false,0);
      else{ui.status='';toast('Não consegui retomar a sala.');paint();}
    }else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'){
      ui.status='Problema de conexão com a internet…';paint();
    }
  });
}
function startHost(name){
  if(!libOk())return;
  net.role='host';net.pid=rid();net.name=name;
  ss.set('tn_pid',net.pid);ss.set('tn_name',name);
  net.G=mkGame(net.pid,name);net.conns={};
  ui.status='Criando sala…';paint();
  openHostPeer(newCode(),false,0);
}
function resumeHost(){
  if(!libOk())return;
  let s;try{s=JSON.parse(ls.get('tn_host'));}catch(e){}
  if(!s||!s.G)return;
  net.role='host';net.G=s.G;net.pid=s.G.hostPid;net.conns={};
  net.G.players.forEach(p=>{p.connected=p.pid===net.pid;});
  ss.set('tn_pid',net.pid);ss.set('tn_role','host');
  ui.status='Retomando a sala…';paint();
  openHostPeer(s.code,true,0);
}

/* ---------- convidado ---------- */
function joinRoom(code,name){
  if(!libOk())return;
  net.role='client';net.code=code;net.name=name;net.got=false;net.leaving=false;
  net.pid=ss.get('tn_pid')||rid();
  ss.set('tn_pid',net.pid);ss.set('tn_name',name);ss.set('tn_room',code);ss.set('tn_role','client');
  ls.set('tn_name',name);
  ui.status='Conectando à sala '+code+'…';paint();
  buildClientPeer();
}
function buildClientPeer(){
  if(net.peer){try{net.peer.destroy();}catch(e){}}
  const peer=new Peer();net.peer=peer;net.conn=null;
  peer.on('open',()=>ensureConn());
  peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});
  peer.on('error',e=>{
    if(e.type==='peer-unavailable'){
      if(!net.got)failJoin('Sala não encontrada. Confira o código e se o anfitrião está com o jogo aberto.');
      else{ui.status='Sala fora do ar. Tentando reconectar…';paint();}
    }else{ui.status='Problema de conexão…';paint();}
  });
}
function ensureConn(){
  if(net.leaving||net.role!=='client')return;
  if(net.conn&&net.conn.open)return;
  if(Date.now()-net.connAt<8000&&net.conn&&!net.conn.open)return;
  if(!net.peer||net.peer.destroyed){buildClientPeer();return;}
  if(net.peer.disconnected){try{net.peer.reconnect();}catch(e){}return;}
  if(!net.peer.open)return;
  net.connAt=Date.now();
  const conn=net.peer.connect('tanonivel-'+net.code,{reliable:true});
  net.conn=conn;
  conn.on('open',()=>conn.send({t:'join',name:net.name,pid:net.pid}));
  conn.on('data',m=>{
    if(!m)return;
    if(m.t==='state'){net.got=true;V=m.v;ui.screen='game';ui.status='';keepAwake();paint();}
    else if(m.t==='error'){if(m.fatal)failJoin(m.m);else toast(m.m);}
  });
  conn.on('close',()=>{if(net.leaving)return;ui.status='Reconectando…';paint();});
}
setInterval(()=>{if(net.role==='client'&&!net.leaving&&net.got)ensureConn();},4000);
function failJoin(msg){
  net.leaving=true;
  if(net.peer){try{net.peer.destroy();}catch(e){}}
  ['tn_room','tn_role'].forEach(ss.del);
  net.role=null;net.got=false;V=null;ui={screen:'home',status:''};
  toast(msg);paint();
}
function leaveRoom(){
  const host=net.role==='host';
  if(!confirm(host?'Encerrar a sala para todos?':'Sair da sala?'))return;
  net.leaving=true;
  if(net.peer){try{net.peer.destroy();}catch(e){}}
  ['tn_room','tn_role'].forEach(ss.del);
  if(host)ls.del('tn_host');
  net.role=null;net.G=null;net.conns={};net.got=false;V=null;ui={screen:'home',status:''};paint();
}

  if(typeof Peer==='undefined'){toast('Não consegui carregar a biblioteca de conexão. Verifique a internet.');return false;}
  return true;
}

/* ---------- construtor de tier list (arrastar com o dedo) ---------- */
let ignoreClick=false;
function blockClick(){ignoreClick=true;setTimeout(()=>{ignoreClick=false;},120);}
function tileEl(it,cls,note){
  return h('div',{class:'tile'+(cls?' '+cls:'')},h('span',{class:'nm'},it),note?h('span',{class:'was'},note):null);
}
function builder(items,submitLabel,onSubmit){
  const wrap=h('div',{});
  const ids=items.map((_,i)=>i);
  function tile(i){
    const el=tileEl(items[i],local.sel===i?'sel':'');
    el.addEventListener('pointerdown',ev=>startDrag(ev,i,el));
    el.addEventListener('contextmenu',e=>e.preventDefault());
    return el;
  }
  function tapRow(t){
    if(ignoreClick||local.sel==null)return;
    local.place[local.sel]=t;local.sel=null;refresh();
  }
  function refresh(){
    const rows=TIERS.map(t=>h('div',{class:'trow','data-tier':t,onclick:()=>tapRow(t)},
      h('div',{class:'tlab',style:'background:'+TCOLOR[t]},t),
      h('div',{class:'tzone'},ids.filter(i=>local.place[i]===t).map(tile))));
    const pool=ids.filter(i=>local.place[i]==null);
    const dock=h('div',{class:'dock','data-tier':'pool',onclick:()=>tapRow(null)},
      pool.length?h('div',{class:'tzone'},pool.map(tile)):h('div',{class:'hint center',style:'padding:4px'},'Todos os itens estão no ranking ✓'),
      h('button',{class:'green',disabled:pool.length>0,onclick:ev=>{ev.stopPropagation();onSubmit({...local.place});}},
        pool.length?'Faltam '+pool.length+' item(ns) — arraste para um nível':submitLabel));
    wrap.replaceChildren(...rows,dock);
  }
  function startDrag(ev,i,el){
    if(ev.pointerType==='mouse'&&ev.button!==0)return;
    const sx=ev.clientX,sy=ev.clientY,pid=ev.pointerId,rect=el.getBoundingClientRect();
    let dragging=false,ghost=null,timer=null,target=null,lastY=sy;
    function cleanup(){
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',cancel);
      if(timer)clearInterval(timer);
      if(ghost)ghost.remove();
      if(target)target.classList.remove('over');
    }
    function move(e){
      if(e.pointerId!==pid)return;
      lastY=e.clientY;
      if(!dragging){
        if(Math.hypot(e.clientX-sx,e.clientY-sy)<8)return;
        dragging=true;
        ghost=el.cloneNode(true);ghost.classList.add('ghost');
        ghost.style.width=rect.width+'px';ghost.style.height=rect.height+'px';
        document.body.appendChild(ghost);
        el.classList.add('dragging');
        timer=setInterval(()=>{if(lastY<90)window.scrollBy(0,-14);else if(lastY>window.innerHeight-130)window.scrollBy(0,14);},16);
      }
      e.preventDefault();
      ghost.style.left=(e.clientX-rect.width/2)+'px';
      ghost.style.top=(e.clientY-rect.height/2)+'px';
      const under=document.elementFromPoint(e.clientX,e.clientY);
      const z=under?under.closest('[data-tier]'):null;
      if(target&&target!==z)target.classList.remove('over');
      if(z)z.classList.add('over');
      target=z;
    }
    function up(e){
      if(e.pointerId!==pid)return;
      const t=target?target.getAttribute('data-tier'):undefined;
      cleanup();blockClick();
      if(!dragging){local.sel=local.sel===i?null:i;}
      else{if(t!==undefined)local.place[i]=t==='pool'?null:t;local.sel=null;}
      refresh();
    }
    function cancel(e){if(e.pointerId!==pid)return;cleanup();refresh();}
    window.addEventListener('pointermove',move,{passive:false});
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',cancel);
  }
  refresh();
  return wrap;
}

function itemsEditor(theme,onContinue){
  const wrap=h('div',{});
  const L=V.limits;

  function problem(){
    const c=clean();
    if(c.length<L.min)return 'Escreva pelo menos '+L.min+' itens';
    if(new Set(c.map(x=>x.toLowerCase())).size!==c.length)return 'Há itens repetidos';
    return null;
  }
  function refresh(focusLast){
    const rows=local.items.map((val,i)=>{
      const inp=h('input',{type:'text',maxlength:String(L.len),placeholder:'Item '+(i+1),value:val,
        oninput:e=>{local.items[i]=e.target.value;upd();}});
      return h('div',{class:'irow'},h('span',{},String(i+1)),inp,
        local.items.length>L.min?h('button',{class:'alt',title:'Remover',onclick:()=>{local.items.splice(i,1);refresh();}},'✕'):null);
    });
    const btn=h('button',{class:'green',id:'cont',style:'width:100%;margin-top:8px',onclick:()=>{
      const p=problem();if(p){toast(p);return;}onContinue(clean());}},'Continuar');

    wrap.replaceChildren(...rows,
      local.items.length<L.max?h('button',{class:'alt',style:'width:100%',onclick:()=>{local.items.push('');refresh(true);}},'+ Adicionar item'):null,
      hint,btn);
    function upd(){const p=problem();btn.disabled=!!p;hint.textContent=p?p:clean().length+' itens ✓';}
    window.__upd=upd;upd();
    if(focusLast){const ins=wrap.querySelectorAll('input');if(ins.length)ins[ins.length-1].focus();}
  }
  refresh(false);
  return wrap;

      if(!truth)return tileEl(items[i],'ro');
      const ok=truth[i]===t;
      return tileEl(items[i],'ro '+(ok?'ok':'bad'),ok?null:'era '+truth[i]);
    })))));
}
function revealView(){
  return [topline(),
    h('div',{class:'panel'},
      h('h2',{class:'center'},'Ranking de '+V.ownerName+' — '+V.theme),
      staticBoard(V.items,V.truth,null)),
    h('div',{class:'panel'},
      h('h2',{},'Pontos desta rodada'),
      V.results.map(r=>h('details',{},
        h('summary',{},r.name+' — '+(r.submitted?r.hits+'/'+V.items.length+' acertos · '+r.points+' pts'+(r.perfect?' 🏆 GABARITOU (x2)':''):'não enviou · 0 pts')),
        r.guess?staticBoard(V.items,r.guess,V.truth):null)),
      h('p',{class:'hint'},'Toque num nome para ver o palpite dele. O ranking geral só aparece no final.')),
    V.isHost?h('div',{class:'center'},h('button',{onclick:()=>send({a:'next'})},V.lastRound?'Ver o ranking final 🏆':'Próxima rodada ➜'))
      :h('p',{class:'hint center'},'Aguardando o anfitrião seguir…'),
    footer()];
}
function finalView(){
  const medals=['🥇','🥈','🥉'];
  return [
    h('div',{class:'panel'},
      h('h2',{class:'center'},'🏆 Ranking final'),
      h('table',{},
        h('tr',{},h('th',{},''),h('th',{},'Jogador'),h('th',{},'Pontos'),h('th',{},'Gabaritou')),
        V.leaderboard.map((p,i)=>h('tr',{},h('td',{class:'medal'},medals[i]||String(i+1)),h('td',{},p.name),h('td',{},h('b',{},String(p.total))),h('td',{},p.perfects?'🏆 x'+p.perfects:'—'))))),
    h('div',{class:'panel'},
      h('h2',{},'Rodada por rodada'),
      V.history.map((r,i)=>h('details',{},
        h('summary',{},(i+1)+'. '+r.theme+' (dono: '+r.owner+')'+(r.skipped?' — pulada':'')),
        r.skipped?null:r.pts.map(x=>h('div',{},x.name+': '+x.p+' pts'+(x.perfect?' 🏆':'')))))),
    V.isHost?h('div',{class:'center'},h('button',{onclick:()=>send({a:'again'})},'Jogar de novo')):h('p',{class:'hint center'},'Aguardando o anfitrião…'),
    footer()
  ];
}

/* ---------- início ---------- */
(function init(){
  paint();
  const role=ss.get('tn_role');
  if(typeof Peer==='undefined')return;
  if(role==='host'&&ls.get('tn_host'))resumeHost();
  else if(role==='client'&&ss.get('tn_room')&&ss.get('tn_name'))joinRoom(ss.get('tn_room'),ss.get('tn_name'));
})();
</script>
